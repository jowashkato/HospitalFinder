name: Build APK & iOS

on:
  push:
    branches: [ main ]
  workflow_dispatch:

defaults:
  run:
    working-directory: hospitalfinder

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: hospitalfinder/build/app/outputs/flutter-apk/app-release.apk

  ios:
    name: iOS (unsigned)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign
      - name: Package unsigned .app
        run: |
          cd build/ios/iphoneos
          mkdir Payload
          cp -r Runner.app Payload/
          zip -r app-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: app-ios-unsigned
          path: hospitalfinder/build/ios/iphoneos/app-unsigned.ipa
