name: Build APK & iOS

on:
  push:
    branches: [ main ]
  workflow_dispatch:

defaults:
  run:
    working-directory: hospitalfinder

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter --version
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
        continue-on-error: true
      - run: flutter test
        continue-on-error: true
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-release-apk
          path: hospitalfinder/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: warn

  ios:
    name: iOS (compile check)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter --version
      - run: flutter pub get
      # Simulator build: compiles the whole iOS app with no signing / Apple account.
      - run: flutter build ios --simulator
      - name: Zip simulator app
        run: |
          set -e
          cd build/ios/iphonesimulator
          zip -qr Runner-simulator.app.zip Runner.app
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-ios-simulator
          path: hospitalfinder/build/ios/iphonesimulator/Runner-simulator.app.zip
          if-no-files-found: warn
