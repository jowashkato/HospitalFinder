name: Build APK & iOS

on:
  push:
    branches: [ main ]
  workflow_dispatch:

defaults:
  run:
    working-directory: hospitalfinder

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter --version
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
        continue-on-error: true
      - run: flutter test
        continue-on-error: true
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-release-apk
          path: hospitalfinder/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: warn

  ios:
    name: iOS (unsigned)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter --version
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign
      - name: Package unsigned .app as .ipa
        run: |
          set -e
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -R Runner.app Payload/
          zip -qr app-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-ios-unsigned
          path: hospitalfinder/build/ios/iphoneos/app-unsigned.ipa
          if-no-files-found: warn
