workflows:
  android-apk:
    name: Android APK
    instance_type: linux_x2
    max_build_duration: 60
    environment:
      flutter: stable
    scripts:
      - name: Get packages
        script: flutter pub get
      - name: Analyze
        script: flutter analyze --no-fatal-infos
      - name: Test
        script: flutter test
      - name: Build APK
        script: flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/*.apk

  ios-unsigned:
    name: iOS (unsigned build check)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
    scripts:
      - name: Get packages
        script: flutter pub get
      - name: Pod install
        script: cd ios && pod install
      - name: Build iOS (no codesign)
        script: flutter build ios --release --no-codesign
    artifacts:
      - build/ios/iphoneos/Runner.app

  # To produce a signed .ipa and ship to TestFlight, add an "ios-release"
  # workflow with an `ios_signing` block (App Store Connect API key +
  # distribution certificate + provisioning profile configured in Codemagic),
  # then `flutter build ipa --export-options-plist=/path/to/ExportOptions.plist`.
